# The web client container. Serves the static client and proxies /v1, /health,
# /contracts and /metrics through to the API so the browser makes same-origin
# requests and no CORS configuration has to be correct for the demo to work.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(v1|contracts|health|metrics) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
    }
}
